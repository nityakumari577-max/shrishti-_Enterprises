<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Customer Login - Shrishti Enterprises</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .auth-box {
            width: 350px;
            max-width: 90%;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .google-login {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            min-height: 20px;
        }

        p {
            text-align: center;
        }

    </style>

    <script
        src="https://accounts.google.com/gsi/client"
        async
        defer>
    </script>

</head>

<body>

<div class="auth-box">

    <h2>Customer Login</h2>

    <!-- ==========================================
         GOOGLE LOGIN CONFIGURATION
    =========================================== -->

    <div
        id="g_id_onload"
        data-client_id="262970468257-3t05qv7mieohujqse224cr3hsjg78o8e.apps.googleusercontent.com"
        data-callback="handleGoogleLogin">
    </div>

    <div class="google-login">

        <div
            class="g_id_signin"
            data-type="standard"
            data-size="large"
            data-theme="outline"
            data-text="continue_with"
            data-shape="rectangular">
        </div>

    </div>

    <div id="message"></div>

</div>


<script>

/* ==========================================
   RENDER BACKEND API
========================================== */

const API_URL =
    "https://shrishti-enterprises-1.onrender.com/api/users";


/* ==========================================
   DEFAULT REDIRECT
========================================== */

const DEFAULT_REDIRECT_PAGE = "product.html";


/* ==========================================
   GOOGLE LOGIN
========================================== */

async function handleGoogleLogin(response) {

    const message =
        document.getElementById("message");

    message.textContent = "Signing in with Google...";

    try {

        /* ==========================================
           SEND GOOGLE CREDENTIAL TO BACKEND
        =========================================== */

        const result = await fetch(
            `${API_URL}/google`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    credential: response.credential
                })
            }
        );


        /* ==========================================
           READ RESPONSE
        =========================================== */

        const data = await result.json();


        /* ==========================================
           HANDLE BACKEND ERROR
        =========================================== */

        if (!result.ok) {

            console.error(
                "Google login failed:",
                data
            );

            message.textContent =
                data.message ||
                "Google login failed";

            return;
        }


        /* ==========================================
           CHECK TOKEN
        =========================================== */

        if (!data.token) {

            console.error(
                "No token received:",
                data
            );

            message.textContent =
                "Login failed: authentication token not received.";

            return;
        }


        /* ==========================================
           SAVE CUSTOMER LOGIN
        =========================================== */

        localStorage.setItem(
            "customerToken",
            data.token
        );


        if (data.user) {

            localStorage.setItem(
                "customerUser",
                JSON.stringify(data.user)
            );

        }


        console.log(
            "Google login successful"
        );


        /* ==========================================
           CHECK WHETHER USER WAS TRYING TO ORDER
        =========================================== */

    
const loginParams =
    new URLSearchParams(
        window.location.search
    );

const redirect =
    loginParams.get("redirect");

if (redirect) {

    window.location.href =
        redirect;

    return;
}

// Normal login
window.location.href =
    DEFAULT_REDIRECT_PAGE;


        /* ==========================================
           NORMAL LOGIN
        =========================================== */

        window.location.href =
            DEFAULT_REDIRECT_PAGE;


    } catch (error) {

        console.error(
            "Google login error:",
            error
        );

        message.textContent =
            "Unable to connect to server. Please try again.";

    }

}

</script>

</body>

</html>
