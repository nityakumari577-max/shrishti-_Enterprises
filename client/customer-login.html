<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Customer Login - Shrishti Enterprises</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .auth-box {
            width: 350px;
            background: rgb(215, 207, 229);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h3 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }

        p {
            text-align: center;
        }
    </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

<div class="auth-box">
    <h3>Customer Login</h3>

    <div id="g_id_onload"
         data-client_id="262970468257-3t05qv7mieohujqse224cr3hsjg78o8e.apps.googleusercontent.com"
         data-callback="handleGoogleLogin">
    </div>

    <div class="g_id_signin"
         data-type="standard"
         data-size="large"
         data-theme="outline"
         data-text="continue_with"
         data-shape="rectangular">
    </div>

<script>
// Fixed Base URL (Removed '/google' trailing path)
const API_URL = "http://localhost:5000/api/users";

// Default page to redirect after successful login
const DEFAULT_REDIRECT_PAGE = "product.html";


// ==========================================
// GOOGLE LOGIN
// ==========================================
async function handleGoogleLogin(response) {
    const message = document.getElementById("message");

    try {
        const result = await fetch(`${API_URL}/google`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                credential: response.credential
            })
        });

        const data = await result.json();

        if (!result.ok) {
            message.textContent = data.message || "Google login failed";
            return;
        }

        // Save customer login
        localStorage.setItem("customerToken", data.token);
        localStorage.setItem("customerUser", JSON.stringify(data.user));

        // Continue previous order or redirect to dashboard
        const redirect = sessionStorage.getItem("orderRedirect");

        if (redirect) {
            sessionStorage.removeItem("orderRedirect");
            window.location.href = redirect;
        } else {
            window.location.href = DEFAULT_REDIRECT_PAGE;
        }

    } catch (error) {
        console.error("Google login error:", error);
        message.textContent = "Unable to connect to server";
    }
}
</script>

</body>
</html>
