<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Customer Login - Shrishti Enterprises</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .auth-box {
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }

        p {
            text-align: center;
        }

    </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

</head>

<body>

<div class="auth-box">

    <h2>Customer Login</h2>
    <div id="g_id_onload"
     data-client_id="262970468257-3t05qv7mieohujqse224cr3hsjg78o8e.apps.googleusercontent.com"
     data-callback="handleGoogleLogin">
</div>

<div class="g_id_signin"
     data-type="standard"
     data-size="large"
     data-theme="outline"
     data-text="continue_with"
     data-shape="rectangular">
</div>

<p>OR</p>

    <form id="loginForm">

        <input
            type="email"
            id="email"
            placeholder="Email Address"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>
        <a href="forgot-password.html">
          Forgot Password?
        </a>

    </form>

    <div id="message"></div>

    <p>
        Don't have an account?
        <a href="customer-register.html">
            Create Account
        </a>
    </p>

</div>


<script>

const API_URL =
    "https://shrishti-enterprises.onrender.com/api/users";


document
    .getElementById("loginForm")
    .addEventListener("submit", async function(e) {

        e.preventDefault();


        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;


        const message =
            document.getElementById("message");


        try {

            const response =
                await fetch(`${"http://localhost:5000/api/auth"}/login`, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email,
                        password
                    })

                });


            const data =
                await response.json();


            if (!response.ok) {

                message.textContent =
                    data.message || "Login failed";

                return;
            }


            localStorage.setItem(
                "customerToken",
                data.token
            );


            localStorage.setItem(
                "customerUser",
                JSON.stringify(data.user)
            );


            // Continue previous order

            const redirect =
                sessionStorage.getItem("orderRedirect");


            if (redirect) {

                sessionStorage.removeItem(
                    "orderRedirect"
                );

                window.location.href =
                    redirect;

            } else {

                window.location.href =
                    "index.html";

            }

        } catch (error) {

            console.error(error);

            message.textContent =
                "Unable to connect to server";

        }

    });
    // ==========================================
// GOOGLE LOGIN
// ==========================================

async function handleGoogleLogin(response) {

    const message =
        document.getElementById("message");

    try {

        const result =
            await fetch(`${"http://localhost:5000/api/auth"}/google`, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    credential: response.credential
                })

            });


        const data =
            await result.json();


        if (!result.ok) {

            message.textContent =
                data.message || "Google login failed";

            return;
        }


        // Save customer login

        localStorage.setItem(
            "customerToken",
            data.token
        );


        localStorage.setItem(
            "customerUser",
            JSON.stringify(data.user)
        );


        // Continue previous order

        const redirect =
            sessionStorage.getItem("orderRedirect");


        if (redirect) {

            sessionStorage.removeItem(
                "orderRedirect"
            );

            window.location.href =
                redirect;

        } else {

            window.location.href =
                "index.html";

        }

    } catch (error) {

        console.error(
            "Google login error:",
            error
        );

        message.textContent =
            "Unable to connect to server";

    }

}

</script>

</body>

</html>
