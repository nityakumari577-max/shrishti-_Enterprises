<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Shrishti Enterprises</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f4f7fb;
    }

    .container {
        width: 90%;
        max-width: 420px;
        background: white;
        padding: 35px;
        border-radius: 12px;
        box-shadow: 0 5px 25px rgba(0,0,0,0.1);
    }

    h2 {
        text-align: center;
        margin-bottom: 10px;
    }

    .description {
        text-align: center;
        color: #666;
        margin-bottom: 25px;
        font-size: 14px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        margin-bottom: 18px;
        font-size: 15px;
    }

    button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: #007bff;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #0056b3;
    }

    #message {
        margin-top: 15px;
        text-align: center;
        font-size: 14px;
    }

    .back {
        display: block;
        text-align: center;
        margin-top: 20px;
        text-decoration: none;
        color: #007bff;
    }
</style>

</head>

<body>
<div class="container">

    <h2>Forgot Password?</h2>

    <p class="description">
        Enter your registered email address.
        We will send you an OTP to reset your Shrishti account password.
    </p>

    <form id="forgotPasswordForm">

        <label for="email">Registered Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <button type="submit">
            Send OTP
        </button>

    </form>

    <div id="message"></div>

    <a href="customer-login.html" class="back">
        Back to Login
    </a>

</div>

<script>

    const API_URL =
        "https://shrishti-enterprises.onrender.com/api/users";

    const form =
        document.getElementById("forgotPasswordForm");

    const message =
        document.getElementById("message");

    form.addEventListener("submit", async (e) => {

        e.preventDefault();

        const email =
            document.getElementById("email").value
            .trim()
            .toLowerCase();

        message.textContent = "Sending OTP...";

        try {

            const response = await fetch(
                `${API_URL}/forgot-password`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        email: email
                    })
                }
            );

            const data = await response.json();

            message.textContent = data.message;

            if (response.ok) {

                localStorage.setItem(
                    "resetPasswordEmail",
                    email
                );

                setTimeout(() => {

                    window.location.href =
                        "reset-password.html";

                }, 1500);
            }

        } catch (error) {

            console.error(error);

            message.textContent =
                "Unable to connect to server.";

        }

    });

</script>

</body>
</html>
