<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Shrishti Enterprises</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        background: #f5f7fa;
        color: #333;
    }

    /* NAVBAR */

    .navbar {
        height: 70px;
        background: white;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 40px;
        border-bottom: 1px solid #ddd;
    }

    .navbar h2 {
        color: #1e3a5f;
    }

    .logout-btn {
        background: #dc3545;
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 5px;
        cursor: pointer;
    }

    .logout-btn:hover {
        background: #bb2d3b;
    }

    /* MAIN */

    .container {
        padding: 35px;
        max-width: 1200px;
        margin: auto;
    }

    .welcome {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
    }

    .welcome h1 {
        color: #1e3a5f;
        margin-bottom: 5px;
    }

    .welcome p {
        color: #777;
    }

    .add-btn {
        background: #1e3a5f;
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 5px;
        cursor: pointer;
    }

    .add-btn:hover {
        background: #162d4a;
    }

    /* STATS */

    .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
        margin-bottom: 30px;
    }

    .stat-card {
        background: white;
        padding: 25px;
        border-radius: 8px;
        border: 1px solid #ddd;
    }

    .stat-card h3 {
        color: #777;
        font-size: 14px;
        margin-bottom: 10px;
    }

    .stat-card p {
        color: #1e3a5f;
        font-size: 28px;
        font-weight: bold;
    }

    /* ADD PRODUCT */

    .add-section {
        background: white;
        padding: 30px;
        border-radius: 8px;
        border: 1px solid #ddd;
        margin-bottom: 30px;
    }

    .add-section h2 {
        color: #1e3a5f;
        margin-bottom: 20px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
        font-size: 14px;
    }

    .form-group input,
    .form-group textarea {
        width: 100%;
        padding: 11px;
        border: 1px solid #ccc;
        border-radius: 5px;
        outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus {
        border-color: #1e3a5f;
    }

    .form-group textarea {
        height: 100px;
        resize: vertical;
    }

    /* PRODUCTS */

    .products-section {
        background: white;
        padding: 30px;
        border-radius: 8px;
        border: 1px solid #ddd;
    }

    .products-section h2 {
        color: #1e3a5f;
        margin-bottom: 20px;
    }

    #productGrid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 20px;
    }

    .product-card {
        border: 1px solid #ddd;
        border-radius: 8px;
        overflow: hidden;
        background: white;
    }

    .product-card img {
        width: 100%;
        height: 180px;
        object-fit: contain;
        background: #f8f8f8;
    }

    .product-info {
        padding: 15px;
    }

    .product-info h3 {
        color: #1e3a5f;
        margin-bottom: 8px;
    }

    .product-info p {
        font-size: 13px;
        color: #666;
        margin-bottom: 6px;
    }

    .actions {
        display: flex;
        gap: 10px;
        margin-top: 15px;
    }

    .edit-btn,
    .delete-btn {
        padding: 8px 15px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    .edit-btn {
        background: #0d6efd;
        color: white;
    }

    .delete-btn {
        background: #dc3545;
        color: white;
    }

    /* RESPONSIVE */

    @media (max-width: 900px) {

        .stats {
            grid-template-columns: 1fr 1fr;
        }

        #productGrid {
            grid-template-columns: 1fr 1fr;
        }

    }

    @media (max-width: 600px) {

        .navbar {
            padding: 0 20px;
        }

        .container {
            padding: 20px;
        }

        .welcome {
            flex-direction: column;
            align-items: flex-start;
            gap: 15px;
        }

        .stats {
            grid-template-columns: 1fr;
        }

        #productGrid {
            grid-template-columns: 1fr;
        }

    }
</style>

</head>

<body>
<!-- NAVBAR -->

<nav class="navbar">

    <h2>Shrishti Enterprises</h2>

    <button
        class="logout-btn"
        onclick="logout()"
    >
        Logout
    </button>

</nav>


<!-- MAIN -->

<main class="container">

    <!-- WELCOME -->

    <section class="welcome">

        <div>

            <h1>Admin Dashboard</h1>

            <p>
                Manage your medical equipment products
            </p>

        </div>
        <!-- Inside your Admin Dashboard Navbar -->
  <a href="admin-orders.html" class="nav-link">
  <i class="fas fa-shopping-cart"></i> Bookings & Orders
   </a>

        <button
            class="add-btn"
            onclick="document.getElementById('addSection').scrollIntoView()"
        >
            + Add Product
        </button>

    </section>


    <!-- STATS -->

    <section class="stats">

        <div class="stat-card">

            <h3>Total Products</h3>

            <p id="totalProducts">0</p>

        </div>


        <div class="stat-card">

            <h3>Categories</h3>

            <p id="totalCategories">0</p>

        </div>


        <div class="stat-card">

            <h3>Admin Status</h3>

            <p>Active</p>

        </div>

    </section>


    <!-- ADD PRODUCT -->

    <section
        class="add-section"
        id="addSection"
    >

        <h2>Add New Product</h2>

        <form id="addProductForm">

            <div class="form-group">

                <label for="name">
                    Product Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter product name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <input
                    type="text"
                    id="category"
                    placeholder="Enter category"
                    required
                >

            </div>


            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    placeholder="Enter product description"
                    required
                ></textarea>

            </div>


            <div class="form-group">

                <label for="price">
                    Price
                </label>

                <input
                    type="text"
                    id="price"
                    placeholder="Enter price or Contact for Price"
                >

            </div>


            <div class="form-group">

                <label for="image">
                    Product Image
                </label>

                <input
                    type="file"
                    id="image"
                    accept="image/*"
                    required
                >

            </div>


            <button
                type="submit"
                class="add-btn"
            >
                Add Product
            </button>


            <p id="message"></p>

        </form>

    </section>
 <!-- edit product -->
  <section
    class="add-section"
    id="editSection"
    style="display: none;"
>

    <h2>Edit Product</h2>

    <form id="editProductForm">

        <input
            type="hidden"
            id="editId"
        >

        <div class="form-group">

            <label>
                Product Name
            </label>

            <input
                type="text"
                id="editName"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Category
            </label>

            <input
                type="text"
                id="editCategory"
                required
            >

        </div>


        <div class="form-group">

            <label>
                Description
            </label>

            <textarea
                id="editDescription"
                required
            ></textarea>

        </div>


        <div class="form-group">

            <label>
                Price
            </label>

            <input
                type="text"
                id="editPrice"
            >

        </div>


        <div class="form-group">

            <label>
                New Image
            </label>

            <input
                type="file"
                id="editImage"
                accept="image/*"
            >

            <small>
                Leave empty if you don't want to change the image.
            </small>

        </div>


        <button
            type="submit"
            class="add-btn"
        >
            Update Product
        </button>


        <button
            type="button"
            class="delete-btn"
            onclick="cancelEdit()"
        >
            Cancel
        </button>


        <p id="editMessage"></p>

    </form>

</section>


    <!-- PRODUCTS -->

    <section class="products-section">

        <h2>All Products</h2>

        <div id="productGrid">

            <!-- Products will be loaded here -->

        </div>

    </section>

</main>


<script src="js/admin.js"></script>

</body>

</html>
