<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account - Shrishti Enterprises</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .auth-box {
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #007bff;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #0056b3;
        }

        p {
            text-align: center;
        }

        a {
            color: #007bff;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }

    </style>

</head>

<body>

    <div class="auth-box">

        <h2>Create Account</h2>

        <form id="registerForm">

            <input
                type="text"
                id="name"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">
                Create Account
            </button>

        </form>

        <div id="message"></div>

        <p>
            Already have an account?
            <a href="customer-login.html">
                Login
            </a>
        </p>

    </div>


<script>

const API_URL =
    "https://shrishti-enterprises.onrender.com/api/users";


document
    .getElementById("registerForm")
    .addEventListener("submit", async function(e) {

        e.preventDefault();


        const name =
            document.getElementById("name").value;

        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;


        const message =
            document.getElementById("message");


        try {

            const response =
                await fetch(`${API_URL}/register`, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        name,
                        email,
                        password
                    })

                });


            const data =
                await response.json();


            if (!response.ok) {

                message.textContent =
                    data.message || "Registration failed";

                return;
            }


            localStorage.setItem(
                "verificationEmail",
                email
            );


            window.location.href =
                "verify-email.html";


        } catch (error) {

            console.error(error);

            message.textContent =
                "Unable to connect to server";

        }

    });

</script>

</body>

</html>
