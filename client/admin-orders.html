<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Orders - Shrishti Enterprises</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            height: 58px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #0d6efd;
        }

        .nav-buttons {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            border: none;
            padding: 7px 13px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
            background: #0d6efd;
            color: white;
        }

        .logout-btn {
            background: #dc3545;
        }

        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 96%;
            max-width: 1450px;
            margin: 18px auto;
        }

        .page-title {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .page-subtitle {
            color: #777;
            font-size: 13px;
            margin-bottom: 15px;
        }

        /* =========================
           MESSAGE
        ========================= */

        #message {
            display: none;
            padding: 9px 12px;
            margin-bottom: 12px;
            border-radius: 5px;
            font-size: 13px;
        }

        /* =========================
           SEARCH BOX
        ========================= */

        .search-box {
            background: white;
            padding: 12px;
            border-radius: 7px;
            box-shadow: 0 2px 7px rgba(0,0,0,0.06);
            margin-bottom: 12px;
        }

        .search-row {
            display: flex;
            gap: 8px;
        }

        .search-input {
            flex: 1;
            height: 36px;
            padding: 0 11px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 13px;
            outline: none;
        }

        .search-input:focus {
            border-color: #0d6efd;
        }

        .search-btn,
        .clear-btn,
        .refresh-btn {
            border: none;
            padding: 0 14px;
            height: 36px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
        }

        .search-btn {
            background: #0d6efd;
            color: white;
        }

        .clear-btn {
            background: #6c757d;
            color: white;
        }

        .refresh-btn {
            background: #198754;
            color: white;
            float: right;
            margin-top: -51px;
            margin-right: 12px;
        }

        /* =========================
           SUMMARY CARDS
        ========================= */

        .summary {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 12px;
        }

        .summary-card {
            background: white;
            padding: 10px 13px;
            border-radius: 7px;
            box-shadow: 0 2px 7px rgba(0,0,0,0.06);

            /* SMALL HEIGHT */
            min-height: 65px;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .summary-title {
            color: #777;
            font-size: 11px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .summary-number {
            font-size: 21px;
            font-weight: bold;
            color: #222;
        }

        .summary-card.pending .summary-number {
            color: #fd7e14;
        }

        .summary-card.delivered .summary-number {
            color: #198754;
        }

        .summary-card.payment .summary-number {
            color: #dc3545;
        }

        /* =========================
           ORDERS CONTAINER
        ========================= */

        .orders-container {
            background: white;
            border-radius: 7px;
            box-shadow: 0 2px 7px rgba(0,0,0,0.06);
            overflow-x: auto;
        }

        .orders-header {
            padding: 11px 14px;
            border-bottom: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .orders-header h2 {
            font-size: 16px;
        }

        .orders-count {
            color: #777;
            font-size: 12px;
        }

        /* =========================
           TABLE
        ========================= */

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1050px;
        }

        th {
            background: #f8f9fa;
            color: #555;
            font-size: 11px;
            text-transform: uppercase;
            padding: 8px 7px;
            border-bottom: 1px solid #ddd;
            white-space: nowrap;
        }

        td {
            padding: 8px 7px;
            font-size: 12px;
            border-bottom: 1px solid #eee;
            vertical-align: middle;
        }

        tr:hover {
            background: #fafafa;
        }

        /* =========================
           PRODUCT
        ========================= */

        .product-name {
            font-weight: bold;
            font-size: 12px;
        }

        .product-id {
            font-size: 9px;
            color: #999;
            margin-top: 2px;
            max-width: 130px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* =========================
           CUSTOMER
        ========================= */

        .customer-name {
            font-weight: bold;
            font-size: 12px;
        }

        .customer-info {
            color: #777;
            font-size: 10px;
            margin-top: 2px;
        }

        /* =========================
           BADGES
        ========================= */

        .badge {
            display: inline-block;
            padding: 3px 6px;
            border-radius: 10px;
            font-size: 9px;
            font-weight: bold;
            white-space: nowrap;
        }

        .badge-paid {
            background: #d1e7dd;
            color: #0f5132;
        }

        .badge-pending {
            background: #fff3cd;
            color: #664d03;
        }

        .badge-failed {
            background: #f8d7da;
            color: #842029;
        }

        .badge-refunded {
            background: #e2e3e5;
            color: #41464b;
        }

        .badge-confirmed {
            background: #cff4fc;
            color: #055160;
        }

        .badge-processing {
            background: #cfe2ff;
            color: #084298;
        }

        .badge-shipped {
            background: #e2d9f3;
            color: #432874;
        }

        .badge-delivered {
            background: #d1e7dd;
            color: #0f5132;
        }

        .badge-cancelled {
            background: #f8d7da;
            color: #842029;
        }

        /* =========================
           SELECT
        ========================= */

        .status-select {
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 4px 5px;
            font-size: 10px;
            background: white;
            cursor: pointer;
            max-width: 105px;
        }

        /* =========================
           ACTION BUTTONS
        ========================= */

        .actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .action-btn {
            border: none;
            padding: 5px 7px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 9px;
            white-space: nowrap;
        }

        .paid-btn {
            background: #198754;
            color: white;
        }

        .deliver-btn {
            background: #0d6efd;
            color: white;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
        }

        .action-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        /* =========================
           NO ORDERS
        ========================= */

        .no-orders {
            text-align: center;
            padding: 35px 15px;
            color: #777;
            font-size: 13px;
        }

        /* =========================
           LOADING
        ========================= */

        .loading {
            text-align: center;
            padding: 25px;
            color: #777;
            font-size: 13px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .summary {
                grid-template-columns: repeat(2, 1fr);
            }

            .search-row {
                flex-wrap: wrap;
            }

            .search-input {
                width: 100%;
                flex-basis: 100%;
            }

            .refresh-btn {
                float: none;
                margin: 10px 0 0 0;
            }
        }

        @media (max-width: 600px) {

            .navbar {
                padding: 0 12px;
            }

            .logo {
                font-size: 16px;
            }

            .nav-btn {
                padding: 6px 9px;
                font-size: 11px;
            }

            .container {
                width: 97%;
                margin: 12px auto;
            }

            .page-title {
                font-size: 20px;
            }

            .summary {
                grid-template-columns: 1fr 1fr;
                gap: 7px;
            }

            .summary-card {
                min-height: 58px;
                padding: 8px;
            }

            .summary-number {
                font-size: 18px;
            }

            .summary-title {
                font-size: 9px;
            }
        }

    </style>
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================= -->

    <nav class="navbar">

        <div class="logo">
            Shrishti Enterprises
        </div>

        <div class="nav-buttons">

            <button class="nav-btn" onclick="goDashboard()">
                Dashboard
            </button>

            <button class="nav-btn logout-btn" onclick="logout()">
                Logout
            </button>

        </div>

    </nav>


    <!-- =========================
         MAIN
    ========================= -->

    <div class="container">

        <h1 class="page-title">
            Customer Orders
        </h1>

        <p class="page-subtitle">
            Manage customer orders, payments and delivery status
        </p>


        <!-- MESSAGE -->

        <div id="message"></div>


        <!-- =========================
             SEARCH
        ========================= -->

        <div class="search-box">

            <div class="search-row">

                <input
                    type="text"
                    id="searchInput"
                    class="search-input"
                    placeholder="Search by customer, order ID, product, email, phone or date..."
                    onkeyup="searchOrders()"
                >

                <button
                    class="search-btn"
                    onclick="searchOrders()"
                >
                    Search
                </button>

                <button
                    class="clear-btn"
                    onclick="clearSearch()"
                >
                    Clear
                </button>

            </div>

        </div>


        <!-- =========================
             SUMMARY
        ========================= -->

        <div class="summary">

            <div class="summary-card">

                <div class="summary-title">
                    Total Orders
                </div>

                <div
                    class="summary-number"
                    id="totalOrders"
                >
                    0
                </div>

            </div>


            <div class="summary-card pending">

                <div class="summary-title">
                    Pending Orders
                </div>

                <div
                    class="summary-number"
                    id="pendingOrders"
                >
                    0
                </div>

            </div>


            <div class="summary-card delivered">

                <div class="summary-title">
                    Delivered
                </div>

                <div
                    class="summary-number"
                    id="deliveredOrders"
                >
                    0
                </div>

            </div>


            <div class="summary-card payment">

                <div class="summary-title">
                    Pending Payments
                </div>

                <div
                    class="summary-number"
                    id="pendingPayments"
                >
                    0
                </div>

            </div>

        </div>


        <!-- =========================
             ORDERS
        ========================= -->

        <div class="orders-container">

            <div class="orders-header">

                <h2>
                    Orders
                </h2>

                <span
                    class="orders-count"
                    id="ordersCount"
                >
                    0 orders
                </span>

            </div>


            <button
                class="refresh-btn"
                onclick="loadOrders()"
            >
                Refresh
            </button>


            <div id="ordersTable">

                <div class="loading">
                    Loading orders...
                </div>

            </div>

        </div>

    </div>


<script>

    // ==========================================
    // CONFIGURATION
    // ==========================================

    const API_URL =
        "https://shrishti-enterprises.onrender.com/api";

    const adminToken =
        localStorage.getItem("adminToken");


    // ==========================================
    // CHECK ADMIN LOGIN
    // ==========================================

    if (!adminToken) {

        window.location.href =
            "admin-login.html";

    }


    // ==========================================
    // STORE ALL ORDERS
    // ==========================================

    let allOrders = [];


    // ==========================================
    // MESSAGE
    // ==========================================

    function showMessage(message, type = "success") {

        const messageBox =
            document.getElementById("message");

        messageBox.innerText = message;

        messageBox.style.display = "block";

        if (type === "success") {

            messageBox.style.background =
                "#d1e7dd";

            messageBox.style.color =
                "#0f5132";

        } else {

            messageBox.style.background =
                "#f8d7da";

            messageBox.style.color =
                "#842029";
        }

        setTimeout(() => {

            messageBox.style.display =
                "none";

        }, 3500);
    }


    // ==========================================
    // DASHBOARD
    // ==========================================

    function goDashboard() {

        window.location.href =
            "admin-dashboard.html";

    }


    // ==========================================
    // LOGOUT
    // ==========================================

    function logout() {

        localStorage.removeItem("adminToken");

        window.location.href =
            "admin-login.html";

    }


    // ==========================================
    // FORMAT DATE
    // ==========================================

    function formatDate(dateString) {

        if (!dateString) {
            return "-";
        }

        const date =
            new Date(dateString);

        if (isNaN(date.getTime())) {
            return "-";
        }

        return date.toLocaleString(
            "en-IN",
            {
                day: "2-digit",
                month: "short",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            }
        );
    }


    // ==========================================
    // ESCAPE HTML
    // ==========================================

    function escapeHtml(value) {

        if (value === null ||
            value === undefined) {

            return "";

        }

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }


    // ==========================================
    // LOAD ORDERS
    // ==========================================

    async function loadOrders() {

        const ordersTable =
            document.getElementById("ordersTable");

        ordersTable.innerHTML =
            '<div class="loading">Loading orders...</div>';

        try {

            const response =
                await fetch(
                    `${API_URL}/orders/admin/all-orders`,
                    {
                        method: "GET",
                        headers: {
                            "Authorization":
                                `Bearer ${adminToken}`
                        }
                    }
                );


            let data;

            try {

                data = await response.json();

            } catch (jsonError) {

                throw new Error(
                    "Server returned an invalid response."
                );

            }


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Failed to load orders."
                );

            }


            allOrders =
                data.orders || [];


            updateSummary(allOrders);

            displayOrders(allOrders);

        } catch (error) {

            console.error(
                "Load orders error:",
                error
            );

            ordersTable.innerHTML = `
                <div class="no-orders">
                    Failed to load orders.<br>
                    ${escapeHtml(error.message)}
                </div>
            `;

            showMessage(
                error.message ||
                "Failed to load orders.",
                "error"
            );

        }

    }


    // ==========================================
    // DISPLAY ORDERS
    // ==========================================

    function displayOrders(orders) {

        const ordersTable =
            document.getElementById("ordersTable");

        const ordersCount =
            document.getElementById("ordersCount");


        ordersCount.innerText =
            `${orders.length} order${orders.length !== 1 ? "s" : ""}`;


        if (!orders.length) {

            ordersTable.innerHTML = `
                <div class="no-orders">
                    No orders found.
                </div>
            `;

            return;

        }


        let html = `

            <table>

                <thead>

                    <tr>

                        <th>Order Date</th>

                        <th>Product</th>

                        <th>Customer</th>

                        <th>Qty</th>

                        <th>Amount</th>

                        <th>Payment</th>

                        <th>Payment Status</th>

                        <th>Order Status</th>

                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody>
        `;


        orders.forEach(order => {

            html += createOrderRow(order);

        });


        html += `

                </tbody>

            </table>

        `;


        ordersTable.innerHTML =
            html;

    }


    // ==========================================
    // UPDATE SUMMARY
    // ==========================================

    function updateSummary(orders) {

        const total =
            orders.length;


        const pending =
            orders.filter(order =>
                order.orderStatus === "Pending"
            ).length;


        const delivered =
            orders.filter(order =>
                order.orderStatus === "Delivered"
            ).length;


        const pendingPayments =
            orders.filter(order =>
                order.paymentStatus === "Pending"
            ).length;


        document.getElementById(
            "totalOrders"
        ).innerText = total;


        document.getElementById(
            "pendingOrders"
        ).innerText = pending;


        document.getElementById(
            "deliveredOrders"
        ).innerText = delivered;


        document.getElementById(
            "pendingPayments"
        ).innerText = pendingPayments;

    }


    // ==========================================
    // CREATE ORDER ROW
    // ==========================================

    function createOrderRow(order) {

        const paymentStatus =
            order.paymentStatus || "Pending";


        const orderStatus =
            order.orderStatus || "Pending";


        let paymentClass =
            "badge-pending";


        if (paymentStatus === "Paid") {

            paymentClass =
                "badge-paid";

        } else if (paymentStatus === "Failed") {

            paymentClass =
                "badge-failed";

        } else if (paymentStatus === "Refunded") {

            paymentClass =
                "badge-refunded";

        }


        let orderClass =
            "badge-pending";


        if (orderStatus === "Confirmed") {

            orderClass =
                "badge-confirmed";

        } else if (orderStatus === "Processing") {

            orderClass =
                "badge-processing";

        } else if (orderStatus === "Shipped") {

            orderClass =
                "badge-shipped";

        } else if (orderStatus === "Delivered") {

            orderClass =
                "badge-delivered";

        } else if (orderStatus === "Cancelled") {

            orderClass =
                "badge-cancelled";

        }


        const isCOD =
            order.paymentMethod === "COD";


        const isPaid =
            paymentStatus === "Paid";


        const isDelivered =
            orderStatus === "Delivered";


        return `

            <tr>

                <!-- DATE -->

                <td>
                    ${formatDate(order.createdAt)}
                </td>


                <!-- PRODUCT -->

                <td>

                    <div class="product-name">
                        ${escapeHtml(
                            order.productName ||
                            "Unknown Product"
                        )}
                    </div>

                    <div class="product-id">
                        ID:
                        ${escapeHtml(
                            order.productId ||
                            order._id ||
                            "-"
                        )}
                    </div>

                </td>


                <!-- CUSTOMER -->

                <td>

                    <div class="customer-name">
                        ${escapeHtml(
                            order.customerName ||
                            "-"
                        )}
                    </div>

                    <div class="customer-info">
                        ${escapeHtml(
                            order.customerEmail ||
                            "-"
                        )}
                    </div>

                    <div class="customer-info">
                        ${escapeHtml(
                            order.customerPhone ||
                            "-"
                        )}
                    </div>

                </td>


                <!-- QUANTITY -->

                <td>
                    ${order.quantity || 1}
                </td>


                <!-- AMOUNT -->

                <td>
                    ₹${Number(
                        order.totalPrice || 0
                    ).toLocaleString("en-IN")}
                </td>


                <!-- PAYMENT METHOD -->

                <td>

                    <span class="badge
                        ${isCOD
                            ? "badge-pending"
                            : "badge-confirmed"}">

                        ${isCOD
                            ? "COD"
                            : "ONLINE"}

                    </span>

                </td>


                <!-- PAYMENT STATUS -->

                <td>

                    <select
                        class="status-select"
                        onchange="updatePaymentStatus(
                            '${order._id}',
                            this.value
                        )"
                    >

                        <option
                            value="Pending"
                            ${paymentStatus === "Pending"
                                ? "selected"
                                : ""}
                        >
                            Pending
                        </option>

                        <option
                            value="Paid"
                            ${paymentStatus === "Paid"
                                ? "selected"
                                : ""}
                        >
                            Paid
                        </option>

                        <option
                            value="Failed"
                            ${paymentStatus === "Failed"
                                ? "selected"
                                : ""}
                        >
                            Failed
                        </option>

                        <option
                            value="Refunded"
                            ${paymentStatus === "Refunded"
                                ? "selected"
                                : ""}
                        >
                            Refunded
                        </option>

                    </select>

                    <br>

                    <span class="badge ${paymentClass}">
                        ${escapeHtml(paymentStatus)}
                    </span>

                </td>


                <!-- ORDER STATUS -->

                <td>

                    <select
                        class="status-select"
                        onchange="updateOrderStatus(
                            '${order._id}',
                            this.value
                        )"
                    >

                        <option
                            value="Pending"
                            ${orderStatus === "Pending"
                                ? "selected"
                                : ""}
                        >
                            Pending
                        </option>

                        <option
                            value="Confirmed"
                            ${orderStatus === "Confirmed"
                                ? "selected"
                                : ""}
                        >
                            Confirmed
                        </option>

                        <option
                            value="Processing"
                            ${orderStatus === "Processing"
                                ? "selected"
                                : ""}
                        >
                            Processing
                        </option>

                        <option
                            value="Shipped"
                            ${orderStatus === "Shipped"
                                ? "selected"
                                : ""}
                        >
                            Shipped
                        </option>

                        <option
                            value="Delivered"
                            ${orderStatus === "Delivered"
                                ? "selected"
                                : ""}
                        >
                            Delivered
                        </option>

                        <option
                            value="Cancelled"
                            ${orderStatus === "Cancelled"
                                ? "selected"
                                : ""}
                        >
                            Cancelled
                        </option>

                    </select>

                    <br>

                    <span class="badge ${orderClass}">
                        ${escapeHtml(orderStatus)}
                    </span>

                </td>


                <!-- ACTIONS -->

                <td>

                    <div class="actions">

                        ${
                            isCOD && !isPaid
                            ? `
                                <button
                                    class="action-btn paid-btn"
                                    onclick="markAsPaid('${order._id}')"
                                >
                                    Mark Paid
                                </button>
                            `
                            : ""
                        }


                        ${
                            !isDelivered
                            ? `
                                <button
                                    class="action-btn deliver-btn"
                                    onclick="markAsDelivered('${order._id}')"
                                >
                                    Delivered
                                </button>
                            `
                            : ""
                        }


                        <button
                            class="action-btn delete-btn"
                            onclick="deleteOrder('${order._id}')"
                        >
                            Delete
                        </button>

                    </div>

                </td>

            </tr>

        `;

    }


    // ==========================================
    // SEARCH ORDERS
    // ==========================================

    function searchOrders() {

        const input =
            document.getElementById(
                "searchInput"
            ).value
            .trim()
            .toLowerCase();


        if (!input) {

            displayOrders(allOrders);

            return;

        }


        const filtered =
            allOrders.filter(order => {

                const values = [

                    order._id,

                    order.productId,

                    order.productName,

                    order.customerName,

                    order.customerEmail,

                    order.customerPhone,

                    order.paymentMethod,

                    order.paymentStatus,

                    order.orderStatus,

                    order.createdAt,

                    order.address

                ];


                return values.some(value =>

                    String(
                        value || ""
                    )
                    .toLowerCase()
                    .includes(input)

                );

            });


        displayOrders(filtered);

    }


    // ==========================================
    // CLEAR SEARCH
    // ==========================================

    function clearSearch() {

        document.getElementById(
            "searchInput"
        ).value = "";

        displayOrders(allOrders);

    }


    // ==========================================
    // UPDATE PAYMENT STATUS
    // ==========================================

    async function updatePaymentStatus(
        orderId,
        status
    ) {

        try {

            const response =
                await fetch(
                    `${API_URL}/orders/${orderId}/payment-status`,
                    {
                        method: "PUT",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "Authorization":
                                `Bearer ${adminToken}`
                        },

                        body: JSON.stringify({
                            paymentStatus: status
                        })
                    }
                );


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.message ||
                    "Failed to update payment status."
                );

            }


            showMessage(
                "Payment status updated successfully."
            );


            await loadOrders();

        } catch (error) {

            console.error(
                "Payment status error:",
                error
            );

            showMessage(
                error.message,
                "error"
            );

        }

    }
