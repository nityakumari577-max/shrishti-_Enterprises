<!DOCTYPE html>

<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Orders - Shrishti Enterprises</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f7fb;
    color: #222;
}

/* =========================
   NAVBAR
========================= */

.navbar {
    height: 58px;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    position: sticky;
    top: 0;
    z-index: 100;
}

.logo {
    font-size: 20px;
    font-weight: bold;
    color: #0d6efd;
}

.nav-buttons {
    display: flex;
    gap: 8px;
}

.nav-btn {
    border: none;
    padding: 7px 13px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 13px;
    background: #0d6efd;
    color: white;
}

.logout-btn {
    background: #dc3545;
}

/* =========================
   MAIN
========================= */

.container {
    width: 96%;
    max-width: 1450px;
    margin: 18px auto;
}

.page-title {
    font-size: 24px;
    margin-bottom: 4px;
}

.page-subtitle {
    color: #777;
    font-size: 13px;
    margin-bottom: 15px;
}

/* =========================
   MESSAGE
========================= */

#message {
    display: none;
    padding: 9px 12px;
    margin-bottom: 12px;
    border-radius: 5px;
    font-size: 13px;
}

/* =========================
   SEARCH
========================= */

.search-box {
    background: white;
    padding: 12px;
    border-radius: 7px;
    box-shadow: 0 2px 7px rgba(0,0,0,0.06);
    margin-bottom: 12px;
}

.search-row {
    display: flex;
    gap: 8px;
}

.search-input {
    flex: 1;
    height: 36px;
    padding: 0 11px;
    border: 1px solid #ddd;
    border-radius: 5px;
    font-size: 13px;
    outline: none;
}

.search-input:focus {
    border-color: #0d6efd;
}

.search-btn,
.clear-btn,
.refresh-btn {
    border: none;
    padding: 0 14px;
    height: 36px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 13px;
}

.search-btn {
    background: #0d6efd;
    color: white;
}

.clear-btn {
    background: #6c757d;
    color: white;
}

.refresh-btn {
    background: #198754;
    color: white;
    float: right;
    margin-top: -51px;
    margin-right: 12px;
}

/* =========================
   SUMMARY
========================= */

.summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 12px;
}

.summary-card {
    background: white;
    padding: 10px 13px;
    border-radius: 7px;
    box-shadow: 0 2px 7px rgba(0,0,0,0.06);
    min-height: 65px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.summary-title {
    color: #777;
    font-size: 11px;
    margin-bottom: 4px;
    text-transform: uppercase;
}

.summary-number {
    font-size: 21px;
    font-weight: bold;
    color: #222;
}

.summary-card.pending .summary-number {
    color: #fd7e14;
}

.summary-card.delivered .summary-number {
    color: #198754;
}

.summary-card.payment .summary-number {
    color: #dc3545;
}

/* =========================
   ORDERS
========================= */

.orders-container {
    background: white;
    border-radius: 7px;
    box-shadow: 0 2px 7px rgba(0,0,0,0.06);
    overflow-x: auto;
}

.orders-header {
    padding: 11px 14px;
    border-bottom: 1px solid #eee;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.orders-header h2 {
    font-size: 16px;
}

.orders-count {
    color: #777;
    font-size: 12px;
}

/* =========================
   TABLE
========================= */

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 1250px;
}

th {
    background: #f8f9fa;
    color: #555;
    font-size: 11px;
    text-transform: uppercase;
    padding: 8px 7px;
    border-bottom: 1px solid #ddd;
    white-space: nowrap;
}

td {
    padding: 8px 7px;
    font-size: 12px;
    border-bottom: 1px solid #eee;
    vertical-align: middle;
}

tr:hover {
    background: #fafafa;
}

/* =========================
   PRODUCT
========================= */

.product-name {
    font-weight: bold;
    font-size: 12px;
}

.product-id {
    font-size: 9px;
    color: #999;
    margin-top: 2px;
    max-width: 130px;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* =========================
   CUSTOMER
========================= */

.customer-name {
    font-weight: bold;
    font-size: 12px;
}

.customer-info {
    color: #777;
    font-size: 10px;
    margin-top: 2px;
}

/* =========================
   BADGES
========================= */

.badge {
    display: inline-block;
    padding: 4px 7px;
    border-radius: 10px;
    font-size: 9px;
    font-weight: bold;
    white-space: nowrap;
}

.badge-paid {
    background: #d1e7dd;
    color: #0f5132;
}

.badge-pending {
    background: #fff3cd;
    color: #664d03;
}

.badge-failed {
    background: #f8d7da;
    color: #842029;
}

.badge-refunded {
    background: #e2e3e5;
    color: #41464b;
}

.badge-online {
    background: #cfe2ff;
    color: #084298;
}

.badge-cod {
    background: #fff3cd;
    color: #664d03;
}

.badge-confirmed {
    background: #cff4fc;
    color: #055160;
}

.badge-processing {
    background: #cfe2ff;
    color: #084298;
}

.badge-shipped {
    background: #e2d9f3;
    color: #432874;
}

.badge-delivered {
    background: #d1e7dd;
    color: #0f5132;
}

.badge-cancelled {
    background: #f8d7da;
    color: #842029;
}

/* =========================
   RAZORPAY
========================= */

.razorpay-id {
    font-size: 9px;
    color: #777;
    margin-top: 4px;
    max-width: 150px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.payment-label {
    font-size: 9px;
    color: #888;
    margin-top: 3px;
}

/* =========================
   SELECT
========================= */

.status-select {
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 4px 5px;
    font-size: 10px;
    background: white;
    cursor: pointer;
    max-width: 110px;
}

/* =========================
   ACTIONS
========================= */

.actions {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    max-width: 170px;
}

.action-btn {
    border: none;
    padding: 5px 7px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 9px;
    white-space: nowrap;
}

.paid-btn {
    background: #198754;
    color: white;
}

.processing-btn {
    background: #6f42c1;
    color: white;
}

.shipped-btn {
    background: #0d6efd;
    color: white;
}

.deliver-btn {
    background: #198754;
    color: white;
}

.delete-btn {
    background: #dc3545;
    color: white;
}

.action-btn:hover {
    opacity: 0.9;
}
/* =========================
   CLICKABLE PRODUCT
========================= */

.product-link {
    color: #0d6efd;
    text-decoration: none;
    font-weight: bold;
    cursor: pointer;
}

.product-link:hover {
    text-decoration: underline;
    color: #084298;
}


/* =========================
   DELIVERY ADDRESS
========================= */

.delivery-address {
    max-width: 180px;
    line-height: 1.4;
}

.address-link {
    color: #0d6efd;
    text-decoration: none;
    cursor: pointer;
    font-size: 11px;
}

.address-link:hover {
    text-decoration: underline;
    color: #084298;
}

.address-label {
    font-size: 9px;
    color: #888;
    margin-bottom: 2px;
}
/* =========================
   NO ORDERS
========================= */

.no-orders {
    text-align: center;
    padding: 35px 15px;
    color: #777;
    font-size: 13px;
}

/* =========================
   LOADING
========================= */

.loading {
    text-align: center;
    padding: 25px;
    color: #777;
    font-size: 13px;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 900px) {

    .summary {
        grid-template-columns: repeat(2, 1fr);
    }

    .search-row {
        flex-wrap: wrap;
    }

    .search-input {
        width: 100%;
        flex-basis: 100%;
    }

    .refresh-btn {
        float: none;
        margin: 10px 0 0 0;
    }
}

@media (max-width: 600px) {

    .navbar {
        padding: 0 12px;
    }

    .logo {
        font-size: 16px;
    }

    .nav-btn {
        padding: 6px 9px;
        font-size: 11px;
    }

    .container {
        width: 97%;
        margin: 12px auto;
    }

    .page-title {
        font-size: 20px;
    }

    .summary {
        grid-template-columns: 1fr 1fr;
        gap: 7px;
    }

    .summary-card {
        min-height: 58px;
        padding: 8px;
    }

    .summary-number {
        font-size: 18px;
    }

    .summary-title {
        font-size: 9px;
    }
}
/* =========================
   ORDER DETAILS PANEL
========================= */

.order-details-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 1000;
}

.order-details-panel {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);

    width: 40%;
    max-width: 650px;
    height: 85%;

    background: white;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25);

    overflow-y: auto;
    padding: 22px;
}

.close-details-btn {
    border: none;
    background: #dc3545;
    color: white;
    width: 32px;
    height: 32px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 18px;
}

.order-product-details {
    display: flex;
    gap: 18px;
    padding: 15px;
    background: #f8f9fa;
    border-radius: 8px;
    margin-bottom: 18px;
}

.order-product-image {
    width: 140px;
    height: 140px;
    object-fit: contain;
    background: white;
    border-radius: 7px;
    border: 1px solid #ddd;
}

.order-product-info {
    flex: 1;
}

.order-product-info h3 {
    font-size: 18px;
    margin-bottom: 8px;
}

.order-product-info p {
    font-size: 13px;
    margin: 5px 0;
    color: #555;
}

.details-section {
    margin-bottom: 18px;
}

.details-section h3 {
    font-size: 15px;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid #eee;
}

.details-row {
    display: flex;
    margin-bottom: 8px;
    font-size: 13px;
}

.details-label {
    width: 130px;
    font-weight: bold;
    color: #555;
}

.details-value {
    flex: 1;
    color: #222;
    word-break: break-word;
}

.customer-address {
    background: #f8f9fa;
    padding: 12px;
    border-radius: 6px;
    line-height: 1.6;
    font-size: 13px;
    white-space: pre-wrap;
    word-break: break-word;
}

.details-total {
    font-size: 18px;
    font-weight: bold;
    color: #198754;
}

@media (max-width: 800px) {
    .order-details-panel {
        width: 90%;
        height: 90%;
    }

    .order-product-details {
        flex-direction: column;
    }

    .order-product-image {
        width: 120px;
        height: 120px;
    }
}



</style>

</head>

<body>

<!-- =========================
     NAVBAR
========================= -->

<nav class="navbar">

<div class="logo">
    Shrishti Enterprises
</div>

<div class="nav-buttons">

    <button
        class="nav-btn"
        onclick="goDashboard()"
    >
        Dashboard
    </button>

    <button
        class="nav-btn logout-btn"
        onclick="logout()"
    >
        Logout
    </button>

</div>

</nav>

<!-- =========================
     MAIN
========================= -->

<div class="container">

<h1 class="page-title">
    Customer Orders
</h1>

<p class="page-subtitle">
    Manage customer orders, payments and delivery status
</p>

<div id="message"></div>


<!-- SEARCH -->

<div class="search-box">

    <div class="search-row">

        <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="Search by customer, order ID, product, email, phone or date..."
            onkeyup="searchOrders()"
        >

        <button
            class="search-btn"
            onclick="searchOrders()"
        >
            Search
        </button>

        <button
            class="clear-btn"
            onclick="clearSearch()"
        >
            Clear
        </button>

    </div>

</div>


<!-- SUMMARY -->

<div class="summary">

    <div class="summary-card">

        <div class="summary-title">
            Total Orders
        </div>

        <div
            class="summary-number"
            id="totalOrders"
        >
            0
        </div>

    </div>


    <div class="summary-card pending">

        <div class="summary-title">
            Pending Orders
        </div>

        <div
            class="summary-number"
            id="pendingOrders"
        >
            0
        </div>

    </div>


    <div class="summary-card delivered">

        <div class="summary-title">
            Delivered
        </div>

        <div
            class="summary-number"
            id="deliveredOrders"
        >
            0
        </div>

    </div>


    <div class="summary-card payment">

        <div class="summary-title">
            Pending Payments
        </div>

        <div
            class="summary-number"
            id="pendingPayments"
        >
            0
        </div>

    </div>

</div>


<!-- ORDERS -->

<div class="orders-container">

    <div class="orders-header">

        <h2>
            Orders
        </h2>

        <span
            class="orders-count"
            id="ordersCount"
        >
            0 orders
        </span>

    </div>


    <button
        class="refresh-btn"
        onclick="loadOrders()"
    >
        Refresh
    </button>


    <div id="ordersTable">

        <div class="loading">
            Loading orders...
        </div>

    </div>

</div>

</div>
<!-- =========================
     ORDER DETAILS PANEL
========================= -->

<div
    id="orderDetailsOverlay"
    class="order-details-overlay"
    onclick="closeOrderDetails(event)"
>

    <div
        id="orderDetailsPanel"
        class="order-details-panel"
        onclick="event.stopPropagation()"
    >

        <div class="order-details-header">

            <h2>
                Order Details
            </h2>

            <button
                class="close-details-btn"
                onclick="closeOrderDetails()"
            >
                ×
            </button>

        </div>

        <div id="orderDetailsContent">

            <div class="loading">
                Loading order details...
            </div>

        </div>

    </div>

</div>

<script>

/* ==========================================
   CONFIGURATION
========================================== */

const API_URL =
    "https://shrishti-enterprises.onrender.com/api";

const adminToken =
    localStorage.getItem("adminToken");

    

/* ==========================================
   CHECK ADMIN LOGIN
========================================== */

if (!adminToken) {

    window.location.href =
        "admin-login.html";

}


/* ==========================================
   STORE ORDERS
========================================== */

let allOrders = [];


/* ==========================================
   MESSAGE
========================================== */

function showMessage(
    message,
    type = "success"
) {

    const messageBox =
        document.getElementById("message");

    messageBox.innerText =
        message;

    messageBox.style.display =
        "block";

    if (type === "success") {

        messageBox.style.background =
            "#d1e7dd";

        messageBox.style.color =
            "#0f5132";

    } else {

        messageBox.style.background =
            "#f8d7da";

        messageBox.style.color =
            "#842029";

    }

    setTimeout(() => {

        messageBox.style.display =
            "none";

    }, 3500);

}


/* ==========================================
   DASHBOARD
========================================== */

function goDashboard() {

    window.location.href =
        "admin-dashboard.html";

}


/* ==========================================
   LOGOUT
========================================== */

function logout() {

    localStorage.removeItem(
        "adminToken"
    );

    window.location.href =
        "admin-login.html";

}


/* ==========================================
   FORMAT DATE
========================================== */

function formatDate(dateString) {

    if (!dateString) {
        return "-";
    }

    const date =
        new Date(dateString);

    if (isNaN(date.getTime())) {
        return "-";
    }

    return date.toLocaleString(
        "en-IN",
        {
            day: "2-digit",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ==========================================
   LOAD ORDERS
========================================== */

async function loadOrders() {

    const ordersTable =
        document.getElementById(
            "ordersTable"
        );

    ordersTable.innerHTML =
        '<div class="loading">Loading orders...</div>';

    try {

        const response =
            await fetch(
                `${API_URL}/orders/admin/all-orders`,
                {
                    method: "GET",
                    headers: {
                        "Authorization":
                            `Bearer ${adminToken}`
                    }
                }
            );


        let data;

        try {

            data =
                await response.json();

        } catch (jsonError) {

            throw new Error(
                "Server returned an invalid response."
            );

        }


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to load orders."
            );

        }


        allOrders =
            Array.isArray(data.orders)
                ? data.orders
                : [];


        updateSummary(
            allOrders
        );

        displayOrders(
            allOrders
        );

    } catch (error) {

        console.error(
            "Load orders error:",
            error
        );

        ordersTable.innerHTML = `
            <div class="no-orders">
                Failed to load orders.<br>
                ${escapeHtml(error.message)}
            </div>
        `;

        showMessage(
            error.message ||
            "Failed to load orders.",
            "error"
        );

    }

}


/* ==========================================
   DISPLAY ORDERS
========================================== */

function displayOrders(
    orders
) {

    const ordersTable =
        document.getElementById(
            "ordersTable"
        );

    const ordersCount =
        document.getElementById(
            "ordersCount"
        );


    ordersCount.innerText =
        `${orders.length} order${orders.length !== 1 ? "s" : ""}`;


    if (!orders.length) {

        ordersTable.innerHTML = `
            <div class="no-orders">
                No orders found.
            </div>
        `;

        return;

    }


    let html = `

        <table>

            <thead>

                <tr>

                    <th>Order Date</th>

                    <th>Product</th>

                    <th>Customer</th>

                    <th>Qty</th>

                    <th>Amount</th>

                    <th>Payment</th>

                    <th>Payment Status</th>

                    <th>Order Status</th>

                    <th>Actions</th>

                </tr>

            </thead>

            <tbody>

    `;


    orders.forEach(
        order => {

            html +=
                createOrderRow(
                    order
                );

        }
    );


    html += `

            </tbody>

        </table>

    `;


    ordersTable.innerHTML =
        html;

}/* ==========================================
   OPEN ORDER DETAILS
========================================== */

async function openOrderDetails(orderId) {

    const overlay =
        document.getElementById(
            "orderDetailsOverlay"
        );

    const content =
        document.getElementById(
            "orderDetailsContent"
        );

    const order =
        allOrders.find(
            item => item._id === orderId
        );

    if (!order) {

        showMessage(
            "Order details not found.",
            "error"
        );

        return;

    }

    overlay.style.display = "block";

    content.innerHTML = `
        <div class="loading">
            Loading product image...
        </div>
    `;

    let product = null;

    try {

        if (order.productId) {

            const response =
                await fetch(
                    `${API_URL}/equipment/${order.productId}`
                );

            if (response.ok) {

                const data =
                    await response.json();

                product =
                    data.equipment ||
                    data.product ||
                    data;

            }

        }

    } catch (error) {

        console.error(
            "Product details error:",
            error
        );

    }


    const productImage =
        product?.image ||
        product?.imageUrl ||
        product?.photo ||
        "";


    const imageHtml =
        productImage
            ? `
                <img
                    src="${escapeHtml(productImage)}"
                    class="order-product-image"
                    alt="Product"
                    onerror="
                        this.style.display='none';
                    "
                >
              `
            : `
                <div
                    class="order-product-image"
                    style="
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        color:#999;
                        font-size:12px;
                    "
                >
                    No Image
                </div>
              `;


    content.innerHTML = `

        <!-- PRODUCT -->

        <div class="order-product-details">

            ${imageHtml}

            <div class="order-product-info">

                <h3>
                    ${escapeHtml(
                        order.productName ||
                        product?.name ||
                        "Unknown Product"
                    )}
                </h3>

                <p>
                    <strong>Product ID:</strong>
                    ${escapeHtml(
                        order.productId || "-"
                    )}
                </p>

                <p>
                    <strong>Quantity:</strong>
                    ${order.quantity || 1}
                </p>

                <p>
                    <strong>Price:</strong>
                    ₹${Number(
                        order.price || 0
                    ).toLocaleString("en-IN")}
                </p>

                <p class="details-total">

                    Total:
                    ₹${Number(
                        order.totalPrice || 0
                    ).toLocaleString("en-IN")}

                </p>

            </div>

        </div>


        <!-- CUSTOMER -->

        <div class="details-section">

            <h3>
                Customer Details

/* ==========================================
   CLOSE ORDER DETAILS
========================================== */

function closeOrderDetails(event) {

    if (
        event &&
        event.target &&
        event.target.id !==
            "orderDetailsOverlay"
    ) {
        return;
    }

    document.getElementById(
        "orderDetailsOverlay"
    ).style.display = "none";

}

/* ==========================================
   SUMMARY
========================================== */

function updateSummary(
    orders
) {

    const total =
        orders.length;


    const pending =
        orders.filter(
            order =>
                order.orderStatus ===
                "Pending"
        ).length;


    const delivered =
        orders.filter(
            order =>
                order.orderStatus ===
                "Delivered"
        ).length;


    const pendingPayments =
        orders.filter(
            order =>
                order.paymentStatus ===
                "Pending"
        ).length;


    document.getElementById(
        "totalOrders"
    ).innerText = total;


    document.getElementById(
        "pendingOrders"
    ).innerText = pending;


    document.getElementById(
        "deliveredOrders"
    ).innerText = delivered;


    document.getElementById(
        "pendingPayments"
    ).innerText =
        pendingPayments;

}


/* ==========================================
   PAYMENT BADGE
========================================== */

function getPaymentClass(
    status
) {

    if (status === "Paid") {
        return "badge-paid";
    }

    if (status === "Failed") {
        return "badge-failed";
    }

    if (status === "Refunded") {
        return "badge-refunded";
    }

    return "badge-pending";

}


/* ==========================================
   ORDER BADGE
========================================== */

function getOrderClass(
    status
) {

    if (status === "Confirmed") {
        return "badge-confirmed";
    }

    if (status === "Processing") {
        return "badge-processing";
    }

    if (status === "Shipped") {
        return "badge-shipped";
    }

    if (status === "Delivered") {
        return "badge-delivered";
    }

    if (status === "Cancelled") {
        return "badge-cancelled";
    }

    return "badge-pending";

}


/* ==========================================
   CREATE ORDER ROW
========================================== */

function createOrderRow(
    order
) {

    const paymentStatus =
        order.paymentStatus ||
        "Pending";


    const orderStatus =
        order.orderStatus ||
        "Pending";


    const paymentClass =
        getPaymentClass(
            paymentStatus
        );


    const orderClass =
        getOrderClass(
            orderStatus
        );


    const isCOD =
        String(
            order.paymentMethod || ""
        ).toUpperCase() ===
        "COD";


    const isOnline =
        String(
            order.paymentMethod || ""
        ).toUpperCase() ===
        "ONLINE";


    const isPaid =
        paymentStatus ===
        "Paid";


    const isConfirmed =
        orderStatus ===
        "Confirmed";


    const isProcessing =
        orderStatus ===
        "Processing";


    const isShipped =
        orderStatus ===
        "Shipped";


    const isDelivered =
        orderStatus ===
        "Delivered";


    const isCancelled =
        orderStatus ===
        "Cancelled";


    /* ==========================================
       ACTION BUTTONS
    ========================================== */

    let actionButtons = "";


    /* COD PENDING PAYMENT */

    if (
        isCOD &&
        !isPaid &&
        !isDelivered &&
        !isCancelled
    ) {

        actionButtons += `

            <button
                class="action-btn paid-btn"
                onclick="event.stopPropagation(); markAsPaid('${order._id}')"
            >
                Mark Paid
            </button>

        `;

    }


    /* PAID + CONFIRMED -> PROCESSING */

    if (
        isPaid &&
        isConfirmed
    ) {

        actionButtons += `

            <button
                class="action-btn processing-btn"
                onclick="event.stopPropagation(); markAsProcessing('${order._id}')"
            >
                Processing
            </button>

        `;

    }


    /* PAID + PROCESSING -> SHIPPED */

    if (
        isPaid &&
        isProcessing
    ) {

        actionButtons += `

            <button
                class="action-btn shipped-btn"
                onclick="event.stopPropagation(); markAsShipped('${order._id}')"
            >
                Shipped
            </button>

        `;

    }


    /* PAID + SHIPPED -> DELIVERED */

    if (
        isPaid &&
        isShipped
    ) {

        actionButtons += `

            <button
                class="action-btn deliver-btn"
                onclick="event.stopPropagation(); markAsDelivered('${order._id}')"
            >
                Delivered
            </button>

        `;

    }


    /* DELETE */

    actionButtons += `

        <button
            class="action-btn delete-btn"
            onclick="event.stopPropagation(); deleteOrder('${order._id}')"
        >
            Delete
        </button>

    `;


    /* ==========================================
       PAYMENT METHOD
    ========================================== */

    let paymentMethodHtml = "";

    if (isCOD) {

        paymentMethodHtml = `

            <span class="badge badge-cod">
                COD
            </span>

        `;

    } else {

        paymentMethodHtml = `

            <span class="badge badge-online">
                ONLINE
            </span>

        `;

    }


    /* ==========================================
       RAZORPAY DETAILS
    ========================================== */

    let razorpayHtml = "";

    if (isOnline) {

        if (order.razorpayPaymentId) {

            razorpayHtml = `

                <div class="payment-label">
                    Razorpay Payment
                </div>

                <div
                    class="razorpay-id"
                    title="${escapeHtml(
                        order.razorpayPaymentId
                    )}"
                >
                    ${escapeHtml(
                        order.razorpayPaymentId
                    )}
                </div>

            `;

        } else if (paymentStatus === "Paid") {

            razorpayHtml = `

                <div class="payment-label">
                    Payment ID not available
                </div>

            `;

        }

    }


    return `
        <tr
        onclick="openOrderDetails('${order._id}')"
        style="cursor: pointer;"
    >



            <!-- DATE -->

            <td>

                ${formatDate(
                    order.createdAt
                )}

            </td>


            <!-- PRODUCT -->

            <td>

                <div class="product-name">

                    ${escapeHtml(
                        order.productName ||
                        "Unknown Product"
                    )}

                </div>

                <div class="product-id">

                    ID:
                    ${escapeHtml(
                        order.productId ||
                        order._id ||
                        "-"
                    )}

                </div>

            </td>
            


            <!-- CUSTOMER -->

            <td>

                <div class="customer-name">

                    ${escapeHtml(
                        order.customerName ||
                        "-"
                    )}

                </div>

                <div class="customer-info">

                    ${escapeHtml(
                        order.customerEmail ||
                        "-"
                    )}

                </div>

                <div class="customer-info">

                    ${escapeHtml(
                        order.customerPhone ||
                        "-"
                    )}

                </div>

            </td>


            <!-- QUANTITY -->

            <td>

                ${order.quantity || 1}

            </td>


            <!-- AMOUNT -->

            <td>

                ₹${Number(
                    order.totalPrice || 0
                ).toLocaleString(
                    "en-IN"
                )}

            </td>


            <!-- PAYMENT METHOD -->

            <td>

                ${paymentMethodHtml}

            </td>


            <!-- PAYMENT STATUS -->

            <td>

                <span class="badge ${paymentClass}">

                    ${escapeHtml(
                        paymentStatus
                    )}

                </span>

                ${razorpayHtml}

            </td>


            <!-- ORDER STATUS -->

            <td>

                <select
    class="status-select"
    onclick="event.stopPropagation()"
    onchange="
        event.stopPropagation();
        updateOrderStatus(
            '${order._id}',
            this.value
        )
    "
>

                    <option
                        value="Pending"
                        ${
                            orderStatus ===
                            "Pending"
                                ? "selected"
                                : ""
                        }
                    >
                        Pending
                    </option>

                    <option
                        value="Confirmed"
                        ${
                            orderStatus ===
                            "Confirmed"
                                ? "selected"
                                : ""
                        }
                    >
                        Confirmed
                    </option>

                    <option
                        value="Processing"
                        ${
                            orderStatus ===
                            "Processing"
                                ? "selected"
                                : ""
                        }
                    >
                        Processing
                    </option>

                    <option
                        value="Shipped"
                        ${
                            orderStatus ===
                            "Shipped"
                                ? "selected"
                                : ""
                        }
                    >
                        Shipped
                    </option>

                    <option
                        value="Delivered"
                        ${
                            orderStatus ===
                            "Delivered"
                                ? "selected"
                                : ""
                        }
                    >
                        Delivered
                    </option>

                    <option
                        value="Cancelled"
                        ${
                            orderStatus ===
                            "Cancelled"
                                ? "selected"
                                : ""
                        }
                    >
                        Cancelled
                    </option>

                </select>

                <br>

                <span class="badge ${orderClass}">

                    ${escapeHtml(
                        orderStatus
                    )}

                </span>

            </td>


            <!-- ACTIONS -->

            <td>

                <div class="actions">

                    ${actionButtons}

                </div>

            </td>

        </tr>

    `;

}


/* ==========================================
   SEARCH
========================================== */

function searchOrders() {

    const input =
        document.getElementById(
            "searchInput"
        )
        .value
        .trim()
        .toLowerCase();


    if (!input) {

        displayOrders(
            allOrders
        );

        return;

    }


    const filtered =
        allOrders.filter(
            order => {

                const values = [

                    order._id,

                    order.productId,

                    order.productName,

                    order.customerName,

                    order.customerEmail,

                    order.customerPhone,

                    order.paymentMethod,

                    order.paymentStatus,

                    order.orderStatus,

                    order.createdAt,

                    order.address,

                    order.razorpayOrderId,

                    order.razorpayPaymentId

                ];


                return values.some(
                    value =>

                        String(
                            value || ""
                        )
                        .toLowerCase()
                        .includes(input)

                );

            }
        );


    displayOrders(
        filtered
    );

}


/* ==========================================
   CLEAR SEARCH
========================================== */

function clearSearch() {

    document.getElementById(
        "searchInput"
    ).value = "";


    displayOrders(
        allOrders
    );

}


/* ==========================================
   UPDATE ORDER STATUS
========================================== */

async function updateOrderStatus(
    orderId,
    status
) {

    try {

        const response =
            await fetch(
                `${API_URL}/orders/${orderId}/order-status`,
                {
                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${adminToken}`

                    },

                    body: JSON.stringify({

                        orderStatus:
                            status

                    })

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to update order status."
            );

        }


        showMessage(
            `Order status changed to ${status}.`
        );


        await loadOrders();

    } catch (error) {

        console.error(
            "Order status error:",
            error
        );

        showMessage(
            error.message,
            "error"
        );

    }

}


/* ==========================================
   MARK COD AS PAID
========================================== */

async function markAsPaid(
    orderId
) {

    const confirmPayment =
        confirm(
            "Have you received the COD payment from the customer?"
        );


    if (!confirmPayment) {
        return;
    }


    try {

        const response =
            await fetch(
                `${API_URL}/orders/${orderId}/mark-paid`,
                {
                    method: "PUT",

                    headers: {

                        "Content-Type":
                            "application/json",

                        "Authorization":
                            `Bearer ${adminToken}`

                    }

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to mark payment as paid."
            );

        }


        showMessage(
            "COD payment marked as Paid."
        );


        await loadOrders();

    } catch (error) {

        console.error(
            "Mark paid error:",
            error
        );

        showMessage(
            error.message,
            "error"
        );

    }

}

/* ==========================================

========================================== */

async function deleteOrder(
    orderId
) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this order?"
        );


    if (!confirmDelete) {
        return;
    }


    try {

        const response =
            await fetch(
                `${API_URL}/orders/${orderId}`,
                {
                    method: "DELETE",

                    headers: {

                        "Authorization":
                            `Bearer ${adminToken}`

                    }

                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.message ||
                "Failed to delete order."
            );

        }


        showMessage(
            "Order deleted successfully."
        );


        await loadOrders();

    } catch (error) {

        console.error(
            "Delete order error:",
            error
        );

        showMessage(
            error.message,
            "error"
        );

    }

}
