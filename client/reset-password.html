<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Shrishti Enterprises</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f4f7fb;
    }

    .container {
        width: 90%;
        max-width: 420px;
        background: white;
        padding: 35px;
        border-radius: 12px;
        box-shadow: 0 5px 25px rgba(0, 0, 0, 0.1);
    }

    h2 {
        text-align: center;
        margin-bottom: 10px;
    }

    .description {
        text-align: center;
        color: #666;
        margin-bottom: 25px;
        font-size: 14px;
    }

    label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        margin-bottom: 18px;
        font-size: 15px;
    }

    button {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 6px;
        background: #007bff;
        color: white;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #0056b3;
    }

    #message {
        margin-top: 15px;
        text-align: center;
        font-size: 14px;
    }

    .back {
        display: block;
        text-align: center;
        margin-top: 20px;
        text-decoration: none;
        color: #007bff;
    }
</style>

</head>

<body>

<div class="container">

    <h2>Reset Password</h2>

    <p class="description">
        Enter the OTP sent to your email and create a new
        Shrishti Enterprises account password.
    </p>

    <form id="resetPasswordForm">

        <label for="otp">OTP</label>

        <input
            type="text"
            id="otp"
            placeholder="Enter 6-digit OTP"
            maxlength="6"
            required
        >

        <label for="newPassword">New Password</label>

        <input
            type="password"
            id="newPassword"
            placeholder="Enter new password"
            minlength="6"
            required
        >

        <label for="confirmPassword">Confirm Password</label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            minlength="6"
            required
        >

        <button type="submit">
            Reset Password
        </button>

    </form>

    <div id="message"></div>

    <a href="customer-login.html" class="back">
        Back to Login
    </a>

</div>

<script>

    const API_URL =
        "https://shrishti-enterprises.onrender.com/api/users";

    const email =
        localStorage.getItem("resetPasswordEmail");

    const form =
        document.getElementById("resetPasswordForm");

    const message =
        document.getElementById("message");


    // Make sure the customer came through
    // the forgot-password page.

    if (!email) {

        message.textContent =
            "Reset session expired. Please request a new OTP.";

        form.style.display = "none";
    }


    form.addEventListener("submit", async (e) => {

        e.preventDefault();

        const otp =
            document.getElementById("otp")
            .value
            .trim();

        const newPassword =
            document.getElementById("newPassword")
            .value;

        const confirmPassword =
            document.getElementById("confirmPassword")
            .value;


        if (newPassword !== confirmPassword) {

            message.textContent =
                "Passwords do not match.";

            return;
        }


        if (newPassword.length < 6) {

            message.textContent =
                "Password must be at least 6 characters.";

            return;
        }


        message.textContent =
            "Resetting password...";


        try {

            const response = await fetch(
                `${API_URL}/reset-password`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        email: email,

                        otp: otp,

                        newPassword: newPassword

                    })
                }
            );


            const data =
                await response.json();


            if (!response.ok) {

                message.textContent =
                    data.message ||
                    "Unable to reset password.";

                return;
            }


            message.textContent =
                "Password reset successfully! Redirecting to login...";


            localStorage.removeItem(
                "resetPasswordEmail"
            );


            setTimeout(() => {

                window.location.href =
                    "customer-login.html";

            }, 2000);


        } catch (error) {

            console.error(error);

            message.textContent =
                "Unable to connect to server.";

        }

    });

</script>

</body>
</html>
